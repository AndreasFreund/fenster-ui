name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - name: Check tag matches package version
        run: test "v$(node -p "require('./packages/fenster-ui/package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm run build
      - run: npm publish -w packages/fenster-ui
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}